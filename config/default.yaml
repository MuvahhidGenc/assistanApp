# HERMES Client — default configuration
# Sensitive values (API key) should come from environment or Windows Credential Manager.

server:
  url: "http://50.6.226.228:8642"
  timeout_seconds: 120
  verify_ssl: false
  model: "hermes-agent"

client:
  name: "HERMES Windows Client"
  max_agent_steps: 50
  agent_step_timeout_seconds: 300
  debug: false
  prefer_short_responses: true

voice:
  enabled: true
  wake_word_enabled: true
  wake_words:
    - abi
    - akhi
    - dostum
  wake_listen_timeout_seconds: 6
  wake_phrase_limit_seconds: 8
  command_listen_timeout_seconds: 12
  command_phrase_limit_seconds: 18
  beep_on_wake: false
  show_listening_prompt: true
  stt_language: "tr-TR"
  tts_backend: "elevenlabs"
  tts_language: "tr-TR"
  tts_gender: "male"
  tts_voice: "tr-TR-AhmetNeural"
  elevenlabs_voice_id: "pNInz6obpgDQGcFmaJgB"
  elevenlabs_model: "eleven_multilingual_v2"

ui:
  window_width: 1360
  window_height: 820
  connection_check_interval_seconds: 60
  notifications_enabled: true
  auto_approve_local_tools: true

security:
  require_approval_for:
    - normal_modification
    - high_risk
  audit_log_path: "%LOCALAPPDATA%/HERMES/audit.log"
  redact_patterns:
    - "password"
    - "token"
    - "api_key"
    - "secret"

logging:
  level: INFO
  format: json

sessions:
  record_sessions: true
  session_ttl_seconds: 3600
  session_key: "hermes-pc-session"
